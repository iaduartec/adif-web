# >>> project-bridge >>>
# Project Bridge MCP (multi-agent coordination) — managed block
# Git remains authoritative for code; Bridge stores coordination metadata only.
[mcp_servers.project-bridge]
command = "sh"
args = ["-c", "exec \"$(git rev-parse --show-toplevel)/.agents/scripts/bridge\" mcp"]
env = { PROJECT_BRIDGE_AGENT = "codex" }

[mcp_servers.project-bridge.tools.record_change]
approval_mode = "approve"

[mcp_servers.project-bridge.tools.release_task]
approval_mode = "approve"

[mcp_servers.project-bridge.tools.claim_task]
approval_mode = "approve"

[mcp_servers.project-bridge.tools.project_status]
approval_mode = "approve"
# <<< project-bridge <<<
